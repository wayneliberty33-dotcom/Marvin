<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marvin - Habit Tracker</title>

  <style>
    /* ===== STYLE: how everything looks ===== */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      margin: 0;
      padding: 24px 16px;
    }
    .app { max-width: 560px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .date { color: #6b7280; margin: 0 0 20px; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    /* Login box */
    .card h2 { margin: 0 0 12px; font-size: 20px; }
    .field { display: block; width: 100%; margin-bottom: 10px; }
    .auth-buttons { display: flex; gap: 8px; }
    .auth-buttons button { flex: 1; }
    button.secondary {
      padding: 10px 14px; font-size: 16px; font-weight: 600;
      background: #fff; color: #1f2937; border: 1px solid #d1d5db;
      border-radius: 8px; cursor: pointer;
    }
    button.secondary:hover { background: #f9fafb; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; }
    .who { font-size: 13px; color: #6b7280; word-break: break-all; }
    button.linkbtn {
      background: none; border: 0; padding: 8px 0 0; font-size: 14px;
      color: #2563eb; cursor: pointer; text-decoration: underline;
    }
    .hint { font-size: 14px; color: #4b5563; margin: 6px 0 12px; }

    /* Reminder banner ("2 habits left today") */
    .banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: #fff7ed; border: 1px solid #fdba74; color: #9a3412;
      border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    }
    .banner.done { background: #f0fdf4; border-color: #86efac; color: #166534; }
    .banner strong { display: block; font-size: 17px; }
    .banner span { font-size: 14px; }
    .banner button { white-space: nowrap; }
    .habit.flash { outline: 3px solid #f59e0b; outline-offset: 2px; }

    /* Today's progress */
    .progress-text { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
    .bar { height: 10px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; background: #16a34a; transition: width .3s; }

    /* Add row */
    .add-row { display: flex; gap: 8px; }
    input[type="text"], input[type="email"], input[type="password"] {
      flex: 1; padding: 10px 12px; font-size: 16px;
      border: 1px solid #d1d5db; border-radius: 8px;
    }
    button.add {
      padding: 10px 18px; font-size: 16px; font-weight: 600;
      background: #2563eb; color: #fff; border: 0; border-radius: 8px; cursor: pointer;
    }
    button.add:hover { background: #1d4ed8; }
    .error { color: #b91c1c; font-size: 14px; margin: 8px 0 0; min-height: 18px; }
    .error.ok { color: #166534; }

    /* Habit rows */
    .habit-top { display: flex; align-items: center; gap: 12px; }
    .habit-top input[type="checkbox"] { width: 24px; height: 24px; cursor: pointer; }
    .habit-name { flex: 1; font-size: 18px; font-weight: 600; word-break: break-word; }
    .habit.done .habit-name { color: #6b7280; text-decoration: line-through; }
    button.delete {
      background: none; border: 1px solid #fca5a5; color: #b91c1c;
      border-radius: 8px; padding: 6px 10px; cursor: pointer;
    }
    button.delete:hover { background: #fef2f2; }

    .stats { display: flex; gap: 16px; margin: 10px 0 8px 36px; font-size: 14px; color: #4b5563; flex-wrap: wrap; }
    .stats strong { color: #111827; }
    .streak { color: #ea580c; font-weight: 700; }

    /* Last 7 days strip */
    .week { display: flex; gap: 6px; margin-left: 36px; }
    .day { text-align: center; font-size: 11px; color: #6b7280; }
    .dot { width: 26px; height: 26px; border-radius: 6px; background: #e5e7eb; margin-bottom: 2px; }
    .dot.on { background: #16a34a; }
    .dot.today { outline: 2px solid #2563eb; outline-offset: 1px; }

    .empty { text-align: center; color: #6b7280; padding: 24px 0; }
    .note { font-size: 12px; color: #9ca3af; text-align: center; }
  </style>
</head>

<body>
  <!-- ===== STRUCTURE: what is on the page ===== -->
  <div class="app">
    <h1>Marvin</h1>
    <p class="date" style="margin-bottom:2px">Your habit tracker for growth</p>
    <p class="date" id="today-label"></p>

    <!-- VIEW 1: shown when you are logged OUT -->
    <div id="auth-view" hidden>
      <div class="card">
        <h2>Log in or create an account</h2>
        <input type="email" id="email" class="field" placeholder="Email" autocomplete="email">
        <input type="password" id="password" class="field" placeholder="Password (8 or more characters)" autocomplete="current-password">
        <div class="auth-buttons">
          <button type="button" id="login-btn" class="add">Log in</button>
          <button type="button" id="signup-btn" class="secondary">Sign up</button>
        </div>
        <button type="button" id="forgot-btn" class="linkbtn">Forgot password?</button>
        <p class="error" id="auth-msg"></p>
      </div>
    </div>

    <!-- VIEW 3: shown after you click the link in a "reset password" email -->
    <div id="reset-view" hidden>
      <div class="card">
        <h2>Choose a new password</h2>
        <input type="password" id="new-password" class="field" placeholder="New password (8 or more characters)" autocomplete="new-password">
        <input type="password" id="new-password2" class="field" placeholder="Type it again" autocomplete="new-password">
        <div class="auth-buttons">
          <button type="button" id="save-pw-btn" class="add">Save password</button>
          <button type="button" id="cancel-reset-btn" class="secondary">Cancel</button>
        </div>
        <p class="error" id="reset-msg"></p>
      </div>
    </div>

    <!-- VIEW 2: shown when you are logged IN -->
    <div id="app-view" hidden>
      <div class="topbar">
        <span class="who" id="who"></span>
        <button type="button" id="logout-btn" class="secondary">Log out</button>
      </div>

      <!-- Reminder banner: tells you how many habits are left to tick today -->
      <div class="banner" id="banner" role="status" aria-live="polite" hidden>
        <div>
          <strong id="banner-title"></strong>
          <span id="banner-sub"></span>
        </div>
        <button type="button" id="banner-btn" class="add">Tick now</button>
      </div>

      <div class="card">
        <div class="progress-text">
          <span>Today's progress</span>
          <span id="progress-text">0 of 0 done</span>
        </div>
        <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      </div>

      <div class="card">
        <div class="add-row">
          <input type="text" id="habit-input" placeholder="New habit, e.g. Read 10 pages" maxlength="60" autocomplete="off">
          <button type="button" id="add-btn" class="add">Add</button>
        </div>
        <p class="error" id="error"></p>
      </div>

      <!-- Shown only if habits from the old browser-only version are found on this device -->
      <div class="card" id="import-card" hidden>
        <strong>Found habits saved on this device from before</strong>
        <p class="hint" id="import-info"></p>
        <div class="auth-buttons">
          <button type="button" id="import-btn" class="add">Import them</button>
          <button type="button" id="import-skip-btn" class="secondary">No thanks</button>
        </div>
        <p class="error" id="import-msg"></p>
      </div>

      <div id="habit-list"></div>

      <p class="note">Saved to your account. Only you can see your habits.</p>
    </div>
  </div>

  <!-- The Supabase library (does the talking to the database and login) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <script>
    // ===== BEHAVIOUR: what the page does =====

    // --- 0. CONNECTION SETTINGS ---
    // The URL and the PUBLISHABLE key are safe to be public. The safety rules in the
    // database (Row Level Security) are what protect the data.
    // NEVER put a "secret" or "service_role" key in this file.
    const SUPABASE_URL = "https://weonjwkebqpyraweckko.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MFi7LFunvnl3wGUwDJwzNw_UrSu3CMR";
    const SITE_URL = "https://wayneliberty33-dotcom.github.io/Marvin/";

    const $ = id => document.getElementById(id);

    // When you click the link in a "reset password" email, it brings you back here with
    // "type=recovery" in the address. We read that BEFORE anything else so we show the
    // "choose a new password" screen instead of logging you straight in.
    const startHash = window.location.hash || "";
    let recovering = /type=recovery/.test(startHash);

    // If the Supabase library didn't load (no internet, blocked), say so clearly.
    if (!window.supabase) {
      $("auth-view").hidden = false;
      const m = $("auth-msg");
      m.textContent = "Could not load the login system. Check your internet and use Chrome.";
    }
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    // --- 1. STATE (what the page currently remembers) ---
    // Each habit looks like: { id: "uuid", name: "Read", doneDates: ["2026-11-23", ...] }
    let habits = [];
    let loaded = false;        // true once habits have come back from the database
    let currentUserId = null;  // who is logged in
    let pending = new Set();   // habits with a save in progress (stops double clicks)

    function setMsg(el, text, kind) {
      el.textContent = text || "";
      el.className = "error" + (kind === "ok" ? " ok" : "");
    }

    // --- 2. DATES ---
    // Uses YOUR local date (not UTC), so "today" changes at your midnight.
    function dateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }
    function daysAgo(n) {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return d;
    }

    // --- 3. STREAK LOGIC (unchanged) ---
    function currentStreak(habit) {
      const done = new Set(habit.doneDates);
      let offset = done.has(dateKey(daysAgo(0))) ? 0 : 1;
      let count = 0;
      while (done.has(dateKey(daysAgo(offset)))) { count++; offset++; }
      return count;
    }
    function bestStreak(habit) {
      const sorted = [...habit.doneDates].sort();
      let best = 0, run = 0, prev = null;
      for (const key of sorted) {
        if (prev && isNextDay(prev, key)) run++; else run = 1;
        if (run > best) best = run;
        prev = key;
      }
      return best;
    }
    function isNextDay(a, b) {
      const [y, m, d] = a.split("-").map(Number);
      return dateKey(new Date(y, m - 1, d + 1)) === b;
    }

    // --- 4. LOGIN / SIGN UP / LOG OUT ---
    // We never see or store passwords. Supabase handles them.
    async function handleLogin() {
      const msg = $("auth-msg");
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) { setMsg(msg, "Enter your email and password."); return; }
      setBusy(true);
      const { error } = await sb.auth.signInWithPassword({ email, password });
      setBusy(false);
      if (error) setMsg(msg, error.message);
      else setMsg(msg, "");
    }

    async function handleSignup() {
      const msg = $("auth-msg");
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) { setMsg(msg, "Enter an email and a password."); return; }
      if (password.length < 8) { setMsg(msg, "Use a password of 8 or more characters."); return; }
      setBusy(true);
      const { data, error } = await sb.auth.signUp({
        email, password, options: { emailRedirectTo: SITE_URL }
      });
      setBusy(false);
      if (error) { setMsg(msg, error.message); return; }
      if (!data.session) {
        // Email confirmation is on: the account exists but must be confirmed first.
        setMsg(msg, "Almost done. Check your email and click the confirmation link, then log in here.", "ok");
      }
    }

    async function handleLogout() {
      await sb.auth.signOut();
    }

    // --- 4b. FORGOT PASSWORD ---
    // Step 1: you type your email and click "Forgot password?". Supabase emails you a link.
    // We always show the same message, so nobody can use this to find out who has an account.
    async function handleForgot() {
      const msg = $("auth-msg");
      const email = $("email").value.trim();
      if (!email) { setMsg(msg, "Type your email above first, then click Forgot password."); return; }
      setBusy(true);
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL });
      setBusy(false);
      if (error) setMsg(msg, error.message);
      else setMsg(msg, "If that email has an account, we sent a reset link. Check your inbox and spam folder.", "ok");
    }

    // Step 2: you click the link in the email, land here, and choose a new password.
    async function handleSaveNewPassword() {
      const msg = $("reset-msg");
      const p1 = $("new-password").value;
      const p2 = $("new-password2").value;
      if (p1.length < 8) { setMsg(msg, "Use a password of 8 or more characters."); return; }
      if (p1 !== p2) { setMsg(msg, "The two passwords don't match."); return; }
      $("save-pw-btn").disabled = true;
      const { error } = await sb.auth.updateUser({ password: p1 });
      $("save-pw-btn").disabled = false;
      if (error) { setMsg(msg, error.message); return; }
      $("new-password").value = "";
      $("new-password2").value = "";
      setMsg(msg, "");
      recovering = false;
      cleanAddressBar();
      const { data } = await sb.auth.getSession();
      currentUserId = null; // make sure the app view is drawn fresh
      onSession(data.session);
    }

    async function handleCancelReset() {
      recovering = false;
      cleanAddressBar();
      await sb.auth.signOut(); // goes back to the login box
    }

    // Removes the long token from the address bar so it isn't left lying around.
    function cleanAddressBar() {
      try { history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) { /* ignore */ }
    }

    // If an email link was expired or already used, Supabase puts an error in the address.
    function showLinkProblem() {
      if (!/error_description=|error_code=/.test(startHash)) return;
      const params = new URLSearchParams(startHash.replace(/^#/, ""));
      const expired = params.get("error_code") === "otp_expired";
      setMsg($("auth-msg"), expired
        ? "That email link has expired or was already used. Type your email and click Forgot password to get a new one."
        : "That email link did not work. Please try again.");
      cleanAddressBar();
    }

    function setBusy(busy) {
      $("login-btn").disabled = busy;
      $("signup-btn").disabled = busy;
    }

    // --- 5. DATABASE ACTIONS ---
    // The database rules make sure these only ever touch YOUR rows.
    async function loadData() {
      const who = currentUserId;
      const err = $("error");
      setMsg(err, "");
      const h = await sb.from("habits").select("id,name").order("created_at", { ascending: true });
      if (who !== currentUserId) return; // logged out or switched while loading
      if (h.error) { setMsg(err, "Could not load habits: " + h.error.message); loaded = true; render(); return; }

      // Fetch ticks in pages of 1000 (the database returns at most 1000 rows per request)
      const checks = [];
      const size = 1000;
      let from = 0;
      while (true) {
        const r = await sb.from("check_ins").select("habit_id,done_on")
          .order("done_on", { ascending: false }).order("id").range(from, from + size - 1);
        if (who !== currentUserId) return;
        if (r.error) { setMsg(err, "Could not load your history: " + r.error.message); break; }
        checks.push(...r.data);
        if (r.data.length < size) break;
        from += size;
      }

      habits = h.data.map(x => ({ id: x.id, name: x.name, doneDates: [] }));
      const byId = new Map(habits.map(x => [x.id, x]));
      for (const c of checks) {
        const hb = byId.get(c.habit_id);
        if (hb) hb.doneDates.push(c.done_on);
      }
      loaded = true;
      render();
      maybeOfferImport();
    }

    // --- 5b. ONE-TIME IMPORT OF OLD HABITS ---
    // Before logins existed, habits were saved in this browser under the name "habits-v1".
    // If we find some, we offer to copy them into your account. Nothing is deleted from the
    // browser, and importing twice never creates duplicates.
    const OLD_KEY = "habits-v1";

    function importFlagKey() { return "marvin-import-done-" + currentUserId; }
    function importAlreadyHandled() {
      try { return localStorage.getItem(importFlagKey()) === "1"; } catch (e) { return false; }
    }
    function markImportHandled() {
      try { localStorage.setItem(importFlagKey(), "1"); } catch (e) { /* ignore */ }
    }

    function isRealDate(s) {
      if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
      const [y, m, d] = s.split("-").map(Number);
      return dateKey(new Date(y, m - 1, d)) === s; // rejects things like 2026-02-31
    }

    // Reads the old habits and keeps only the clean ones (so bad data can't break the import).
    function readOldHabits() {
      try {
        const raw = localStorage.getItem(OLD_KEY);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [];
        const out = [];
        const seen = new Set();
        for (const h of arr) {
          if (!h || typeof h.name !== "string") continue;
          const name = h.name.trim().slice(0, 60);
          if (!name || seen.has(name.toLowerCase())) continue;
          seen.add(name.toLowerCase());
          const dates = Array.isArray(h.doneDates)
            ? [...new Set(h.doneDates.filter(isRealDate))] : [];
          out.push({ name, dates });
        }
        return out;
      } catch (e) { return []; }
    }

    function maybeOfferImport() {
      const card = $("import-card");
      if (importAlreadyHandled()) { card.hidden = true; return; }
      const old = readOldHabits();
      if (old.length === 0) { card.hidden = true; return; }
      const days = old.reduce((n, o) => n + o.dates.length, 0);
      $("import-info").textContent =
        old.length + (old.length === 1 ? " habit" : " habits") + " and " + days +
        (days === 1 ? " day" : " days") + " of history can be copied into your account.";
      setMsg($("import-msg"), "");
      $("import-btn").disabled = false;
      card.hidden = false;
    }

    async function doImport() {
      const msg = $("import-msg");
      const old = readOldHabits();
      if (old.length === 0) return;
      const who = currentUserId;
      $("import-btn").disabled = true;
      setMsg(msg, "Importing...");

      // 1) Create the habits you don't already have (matching names are reused, not duplicated)
      const have = new Map(habits.map(h => [h.name.toLowerCase(), h.id]));
      const toCreate = old.filter(o => !have.has(o.name.toLowerCase())).map(o => ({ name: o.name }));
      if (toCreate.length) {
        const r = await sb.from("habits").insert(toCreate).select("id,name");
        if (who !== currentUserId) return;
        if (r.error) { setMsg(msg, "Import stopped: " + r.error.message + ". You can click Import again."); $("import-btn").disabled = false; return; }
        for (const row of r.data) have.set(row.name.toLowerCase(), row.id);
      }

      // 2) Copy the days, in chunks of 500. "ignore duplicates" makes it safe to run again.
      const rows = [];
      for (const o of old) {
        const id = have.get(o.name.toLowerCase());
        for (const d of o.dates) rows.push({ habit_id: id, done_on: d });
      }
      for (let i = 0; i < rows.length; i += 500) {
        const r = await sb.from("check_ins")
          .upsert(rows.slice(i, i + 500), { onConflict: "habit_id,done_on", ignoreDuplicates: true });
        if (who !== currentUserId) return;
        if (r.error) { setMsg(msg, "Import stopped: " + r.error.message + ". You can click Import again; nothing will be duplicated."); $("import-btn").disabled = false; return; }
      }

      markImportHandled();
      $("import-card").hidden = true;
      await loadData();
    }

    function skipImport() {
      markImportHandled();
      $("import-card").hidden = true;
    }

    async function addHabit(name) {
      const err = $("error");
      const { data, error } = await sb.from("habits").insert({ name }).select("id,name").single();
      if (error) {
        // 23505 = "already exists" (you can't have the same habit twice)
        setMsg(err, error.code === "23505" ? "You already have that habit." : "Could not add: " + error.message);
        return false;
      }
      habits.push({ id: data.id, name: data.name, doneDates: [] });
      render();
      return true;
    }

    async function toggleToday(id) {
      if (pending.has(id)) return;
      const habit = habits.find(h => h.id === id);
      if (!habit) return;
      const err = $("error");
      const today = dateKey(new Date());
      const wasDone = habit.doneDates.includes(today);
      pending.add(id);
      setMsg(err, "");

      let error = null;
      if (wasDone) {
        ({ error } = await sb.from("check_ins").delete().eq("habit_id", id).eq("done_on", today));
      } else {
        ({ error } = await sb.from("check_ins").insert({ habit_id: id, done_on: today }));
        if (error && error.code === "23505") error = null; // already ticked (e.g. on another device)
      }
      pending.delete(id);

      if (error) { setMsg(err, "Could not save: " + error.message); render(); return; }
      if (wasDone) habit.doneDates = habit.doneDates.filter(d => d !== today);
      else if (!habit.doneDates.includes(today)) habit.doneDates.push(today);
      render();
    }

    async function deleteHabit(id) {
      const habit = habits.find(h => h.id === id);
      if (!habit) return;
      if (!confirm('Delete "' + habit.name + '" and all its history?')) return;
      const { error } = await sb.from("habits").delete().eq("id", id);
      if (error) { setMsg($("error"), "Could not delete: " + error.message); return; }
      habits = habits.filter(h => h.id !== id);
      render();
    }

    // --- 6. DRAWING THE PAGE ---
    // We use textContent (not innerHTML) for habit names so typed text can never run as code.
    // --- 6a. THE REMINDER BANNER ---
    // Shows how many habits you have NOT ticked today. It is worked out fresh every time
    // the page is drawn, so it is always up to date. It also puts the number in the
    // browser tab title, e.g. "(2) Marvin - Habit Tracker".
    const BASE_TITLE = "Marvin - Habit Tracker";

    function updateBanner() {
      const banner = $("banner");
      if (!currentUserId || !loaded || habits.length === 0) {
        banner.hidden = true;
        document.title = BASE_TITLE;
        return;
      }
      const today = dateKey(new Date());
      const left = habits.filter(h => !h.doneDates.includes(today));
      banner.hidden = false;

      if (left.length === 0) {
        banner.className = "banner done";
        $("banner-title").textContent = "All done for today. Great work!";
        $("banner-sub").textContent = "Come back tomorrow to keep your streaks going.";
        $("banner-btn").hidden = true;
        document.title = BASE_TITLE;
        return;
      }

      banner.className = "banner";
      $("banner-title").textContent = left.length + (left.length === 1 ? " habit" : " habits") + " left today";
      // If ticking would save a running streak, say so (use the longest one at risk).
      let risk = null;
      for (const h of left) {
        const s = currentStreak(h);
        if (s > 0 && (!risk || s > risk.streak)) risk = { streak: s, name: h.name };
      }
      $("banner-sub").textContent = risk
        ? "Don't lose your " + risk.streak + "-day streak on \"" + risk.name + "\"."
        : "A quick tick keeps you on track.";
      $("banner-btn").hidden = false;
      document.title = "(" + left.length + ") " + BASE_TITLE;
    }

    // "Tick now": scrolls to the first habit you haven't done and highlights it briefly.
    function handleBannerBtn() {
      const card = document.querySelector("#habit-list .habit:not(.done)");
      if (!card) return;
      try { card.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) { card.scrollIntoView(); }
      card.classList.add("flash");
      setTimeout(() => card.classList.remove("flash"), 1800);
    }

    // If the page stays open past midnight, a new day has started: redraw so "today" is right.
    let shownDay = dateKey(new Date());
    function setTodayLabel() {
      $("today-label").textContent =
        new Date().toLocaleDateString("en", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    }
    function checkNewDay() {
      const nowDay = dateKey(new Date());
      if (nowDay === shownDay) return;
      shownDay = nowDay;
      setTodayLabel();
      if (currentUserId) render();
    }

    function render() {
      updateBanner();
      const today = dateKey(new Date());
      const list = $("habit-list");
      list.innerHTML = "";

      const doneCount = habits.filter(h => h.doneDates.includes(today)).length;
      $("progress-text").textContent = doneCount + " of " + habits.length + " done";
      $("bar-fill").style.width = habits.length ? (doneCount / habits.length * 100) + "%" : "0%";

      if (!loaded) {
        const wait = document.createElement("div");
        wait.className = "card empty";
        wait.textContent = "Loading your habits...";
        list.appendChild(wait);
        return;
      }
      if (habits.length === 0) {
        const empty = document.createElement("div");
        empty.className = "card empty";
        empty.textContent = "No habits yet. Add your first one above.";
        list.appendChild(empty);
        return;
      }

      for (const habit of habits) {
        const isDone = habit.doneDates.includes(today);

        const card = document.createElement("div");
        card.className = "card habit" + (isDone ? " done" : "");

        const top = document.createElement("div");
        top.className = "habit-top";

        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = isDone;
        box.setAttribute("aria-label", "Mark " + habit.name + " done for today");
        // "click" instead of "change": more reliable in some browsers
        box.addEventListener("click", () => toggleToday(habit.id));

        const name = document.createElement("span");
        name.className = "habit-name";
        name.textContent = habit.name;

        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete";
        del.textContent = "Delete";
        del.addEventListener("click", () => deleteHabit(habit.id));

        top.append(box, name, del);

        const stats = document.createElement("div");
        stats.className = "stats";
        const streak = currentStreak(habit);
        stats.innerHTML =
          '<span class="streak">🔥 <span data-s></span></span>' +
          '<span>Best: <strong data-b></strong></span>' +
          '<span>Total days: <strong data-t></strong></span>';
        stats.querySelector("[data-s]").textContent = streak + (streak === 1 ? " day" : " days");
        stats.querySelector("[data-b]").textContent = bestStreak(habit);
        stats.querySelector("[data-t]").textContent = habit.doneDates.length;

        const week = document.createElement("div");
        week.className = "week";
        for (let i = 6; i >= 0; i--) {
          const d = daysAgo(i);
          const cell = document.createElement("div");
          cell.className = "day";
          const dot = document.createElement("div");
          dot.className = "dot" +
            (habit.doneDates.includes(dateKey(d)) ? " on" : "") +
            (i === 0 ? " today" : "");
          const label = document.createElement("div");
          label.textContent = d.toLocaleDateString("en", { weekday: "short" }).slice(0, 3);
          cell.append(dot, label);
          week.appendChild(cell);
        }

        card.append(top, stats, week);
        list.appendChild(card);
      }
    }

    // --- 7. ADD BUTTON (plain button, no <form>, so it works in previews too) ---
    let adding = false;
    async function handleAdd() {
      if (adding) return;
      const input = $("habit-input");
      const err = $("error");
      const name = input.value.trim();
      if (name === "") { setMsg(err, "Type a habit first."); return; }
      if (habits.some(h => h.name.toLowerCase() === name.toLowerCase())) {
        setMsg(err, "You already have that habit."); return;
      }
      setMsg(err, "");
      adding = true;
      const ok = await addHabit(name);
      adding = false;
      if (ok) { input.value = ""; input.focus(); }
    }

    // --- 8. SWITCHING BETWEEN LOGGED-OUT AND LOGGED-IN ---
    function showView(name) {
      $("auth-view").hidden = name !== "auth";
      $("app-view").hidden = name !== "app";
      $("reset-view").hidden = name !== "reset";
    }

    function onSession(session) {
      if (recovering && session && session.user) {
        // You arrived from a reset-password email: ask for a new password first.
        currentUserId = null;
        habits = []; loaded = false;
        showView("reset");
        return;
      }
      if (session && session.user) {
        if (currentUserId === session.user.id) return; // already showing this user
        currentUserId = session.user.id;
        habits = []; loaded = false;
        $("who").textContent = session.user.email || "";
        showView("app");
        $("password").value = "";
        $("import-card").hidden = true;
        render();
        loadData();
      } else {
        currentUserId = null;
        habits = []; loaded = false;
        showView("auth");
        $("import-card").hidden = true;
        $("banner").hidden = true;
        document.title = BASE_TITLE;
        $("habit-list").innerHTML = "";
      }
    }

    // --- 9. START ---
    setTodayLabel();
    // Check for a new day every minute, and whenever you come back to this tab.
    setInterval(checkNewDay, 60000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) checkNewDay(); });
    window.addEventListener("focus", checkNewDay);

    $("login-btn").addEventListener("click", handleLogin);
    $("signup-btn").addEventListener("click", handleSignup);
    $("logout-btn").addEventListener("click", handleLogout);
    $("banner-btn").addEventListener("click", handleBannerBtn);
    $("forgot-btn").addEventListener("click", handleForgot);
    $("save-pw-btn").addEventListener("click", handleSaveNewPassword);
    $("cancel-reset-btn").addEventListener("click", handleCancelReset);
    $("new-password2").addEventListener("keydown", e => { if (e.key === "Enter") handleSaveNewPassword(); });
    $("import-btn").addEventListener("click", doImport);
    $("import-skip-btn").addEventListener("click", skipImport);
    showLinkProblem();
    $("add-btn").addEventListener("click", handleAdd);
    $("habit-input").addEventListener("keydown", e => { if (e.key === "Enter") handleAdd(); });
    $("password").addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });

    if (sb) {
      // Supabase tells us when you log in, log out, or when the page opens with a saved login.
      // setTimeout avoids a known problem of calling the database inside this callback.
      sb.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") recovering = true;
        if (event === "INITIAL_SESSION" || event === "SIGNED_IN" || event === "SIGNED_OUT" || event === "PASSWORD_RECOVERY") {
          setTimeout(() => onSession(session), 0);
        }
      });
    }
  </script>
</body>
</html>
